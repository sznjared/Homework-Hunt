name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Landscape, fullscreen, no autoplay block
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' $M
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#</style>#<item name="android:windowFullscreen">true</item></style>#' $S
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: HomeworkHunt-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish release (easy download link)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HomeworkHunt.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HomeworkHunt.apk --title "Homework Hunt (latest APK)" --notes "Download HomeworkHunt.apk, i-install sa Android phone."
